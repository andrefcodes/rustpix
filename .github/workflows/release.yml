name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-15

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux Dependencies ---
      - name: Install dependencies (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev pkg-config

      - name: Install dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          
          # Restrict existing sources to amd64 to avoid arm64 404s on Azure mirrors
          sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
             sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Add Ubuntu Ports sources for ARM64
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list.d/arm64-source.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          EOF'

          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          sudo apt-get install -y libheif-dev:arm64
      
      # --- macOS Dependencies ---
      - name: Install dependencies (macOS Apple Silicon)
        if: matrix.target == 'aarch64-apple-darwin'
        run: brew install libheif pkg-config

      - name: Install dependencies (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          # Install Homebrew for x86_64 (under Rosetta)
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          
          # Install x86_64 dependencies
          /usr/local/bin/brew install libheif pkg-config
          
          # Set paths to use the x86_64 libraries
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "dyld_library_path=/usr/local/lib" >> $GITHUB_ENV
          echo "PATH=/usr/local/bin:$PATH" >> $GITHUB_ENV

      # --- Windows Dependencies ---
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install libheif:x64-windows-static-md
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_DYNAMIC: 1

      # --- Build & Upload ---
      - name: Build and Upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rustpix
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # ARM64 Cross-compilation config for Cargo/PKG_CONFIG
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig/' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
